# Hibernate Tools configuration for on-demand entity regeneration only.
# Supabase SQL migrations own DDL — do not use hbm2ddl update/create against the shared database.

hibernate.connection.driver_class=org.postgresql.Driver
hibernate.connection.url=jdbc:postgresql://127.0.0.1:54322/postgres
hibernate.connection.username=postgres
hibernate.connection.password=postgres
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.default_schema=public
hibernate.hbm2ddl.auto=validate
