version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "schema/"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # PostGIS/pgvector columns use raw SQL in repositories; map as opaque bytes.
          - column: "properties.location"
            go_type:
              type: "byte"
              slice: true
          - column: "property_search_embeddings.embedding"
            go_type:
              type: "byte"
              slice: true
