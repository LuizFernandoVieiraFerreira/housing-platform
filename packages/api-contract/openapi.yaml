          minLength: 1
          maxLength: 120
        roomType:
          type: string
          maxLength: 80
        sizeSqm:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        maxOccupancy:
          type: integer
          minimum: 1
          maximum: 20
        monthlyPriceKrw:
          type: integer
          minimum: 100000
        availableFrom:
          $ref: '#/components/schemas/CalendarDate'
    HostRoom:
      type: object
      additionalProperties: false
      required: [id, name, roomType, sizeSqm, maxOccupancy, monthlyPriceKrw, status, availableFrom]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        roomType:
          type: [string, 'null']
        sizeSqm:
          type: [number, 'null']
        maxOccupancy:
          type: integer
          minimum: 1
        monthlyPriceKrw:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/RoomStatus'
        availableFrom:
          $ref: '#/components/schemas/NullableDate'
    HostPropertyListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - slug
        - propertyType
        - district
        - status
        - bookingMode
        - monthlyPriceMin
        - roomCount
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        slug:
          type: string
        propertyType:
          $ref: '#/components/schemas/AccommodationType'
        district:
          type: string
        status:
          $ref: '#/components/schemas/PropertyStatus'
        bookingMode:
          $ref: '#/components/schemas/BookingMode'
        monthlyPriceMin:
          type: [integer, 'null']
        roomCount:
          type: integer
          minimum: 0
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    HostPropertyList:
      type: array
      items:
        $ref: '#/components/schemas/HostPropertyListItem'
    HostPropertyDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - slug
        - description
        - propertyType
        - addressLine1
        - addressLine2
        - city
        - postalCode
        - district
        - nearestStationName
        - nearestStationWalkMin
        - status
        - bookingMode
        - minStayNights
        - tags
        - latitude
        - longitude
        - amenityIds
        - rooms
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        propertyType:
          $ref: '#/components/schemas/AccommodationType'
        addressLine1:
          type: string
        addressLine2:
          type: [string, 'null']
        city:
          type: string
        postalCode:
          type: [string, 'null']
        district:
          type: string
        nearestStationName:
          type: [string, 'null']
        nearestStationWalkMin:
          type: [integer, 'null']
        status:
          $ref: '#/components/schemas/PropertyStatus'
        bookingMode:
          $ref: '#/components/schemas/BookingMode'
        minStayNights:
          type: integer
          minimum: 1
        tags:
          type: array
          items:
            type: string
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        amenityIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/HostRoom'
    CreatedId:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
    PropertyStatusChange:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/PropertyStatus'
