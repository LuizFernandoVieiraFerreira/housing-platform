  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications read
      responses:
        '200':
          description: Number of notifications marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllNotificationsReadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Get the current profile
      responses:
        '200':
          description: Caller profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: Update the current profile
      description: Role cannot be changed through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.
  parameters:
    PropertyId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BookingId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HostId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HousingRequestId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Query:
      name: query
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/query'
    PropertyType:
      name: propertyType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/propertyType'
    CheckIn:
      name: checkIn
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/checkIn'
    CheckOut:
      name: checkOut
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/checkOut'
    Guests:
      name: guests
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/guests'
    PriceMin:
      name: priceMin
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/priceMin'
    PriceMax:
      name: priceMax
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/priceMax'
    Sort:
      name: sort
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/sort'
    CenterLat:
      name: centerLat
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/centerLat'
    CenterLng:
      name: centerLng
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/centerLng'
    North:
      name: north
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/north'
    South:
      name: south
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/south'
    East:
      name: east
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/east'
    West:
      name: west
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/west'
    AmenitySlugs:
      name: amenitySlugs
      in: query
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/amenitySlugs'
    MaxStationWalkMin:
      name: maxStationWalkMin
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/maxStationWalkMin'
    ExcludePropertyIds:
      name: excludePropertyIds
      in: query
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/PropertySearchQuery/properties/excludePropertyIds'
    RoomIdQuery:
      name: roomId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CheckInRequired:
      name: checkIn
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/CalendarDate'
    CheckOutRequired:
      name: checkOut
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/CalendarDate'
    GuestCount:
      name: guestCount
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 20
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Check-out must be after check-in
              details: {}
    Unauthenticated:
      description: The JWT is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: The caller is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Cannot cancel this booking
              details: {}
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: The request conflicts with current booking or payment state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    RateLimited:
      description: The caller exceeded the rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ExternalServiceError:
      description: An upstream provider, such as Toss, failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    Uuid:
      type: string
      format: uuid
    CalendarDate:
      type: string
      format: date
      description: Calendar date in YYYY-MM-DD form.
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 timestamp with a timezone offset.
    NullableDate:
      anyOf:
        - $ref: '#/components/schemas/CalendarDate'
        - type: 'null'
    NullableDateTime:
      anyOf:
        - $ref: '#/components/schemas/DateTime'
        - type: 'null'
    JsonObject:
      type: object
      additionalProperties: true
      description: Arbitrary JSON object.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - BOOKING_CONFLICT
        - BOOKING_EXPIRED
        - PAYMENT_FAILED
        - PAYMENT_AMOUNT_MISMATCH
        - EXTERNAL_SERVICE_ERROR
        - RATE_LIMITED
        - INTERNAL_ERROR
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
        details:
          $ref: '#/components/schemas/JsonObject'
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    AccommodationType:
      type: string
      enum: [share-house, studio, micro-studio, multi-bedroom]
    PropertyStatus:
      type: string
      enum: [draft, pending_review, published, archived]
    BookingMode:
      type: string
      enum: [instant, request]
    RoomStatus:
      type: string
      enum: [available, unavailable, archived]
    PropertySearchSort:
      type: string
      enum: [recommended, price_asc, price_desc, distance, semantic]
    PropertySearchQuery:
      type: object
      additionalProperties: false
      description: Check-out must be after check-in, and priceMax must be greater than or equal to priceMin.
      properties:
        query:
          type: string
          maxLength: 120
        propertyType:
          $ref: '#/components/schemas/AccommodationType'
        checkIn:
          $ref: '#/components/schemas/CalendarDate'
        checkOut:
          $ref: '#/components/schemas/CalendarDate'
        guests:
          type: integer
          minimum: 1
          maximum: 20
        priceMin:
          type: integer
          minimum: 0
        priceMax:
          type: integer
          minimum: 0
        sort:
          $ref: '#/components/schemas/PropertySearchSort'
        centerLat:
          type: number
          minimum: -90
          maximum: 90
        centerLng:
          type: number
          minimum: -180
          maximum: 180
        north:
          type: number
          minimum: -90
          maximum: 90
        south:
          type: number
          minimum: -90
          maximum: 90
        east:
          type: number
          minimum: -180
          maximum: 180
        west:
          type: number
          minimum: -180
          maximum: 180
        amenitySlugs:
          type: array
          items:
            type: string
        maxStationWalkMin:
          type: integer
          minimum: 1
          maximum: 120
        excludePropertyIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    PropertyCard:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - slug
        - propertyType
        - district
        - nearestStationName
        - monthlyPriceMin
        - coverImageUrl
        - coverImageAlt
        - tags
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        slug:
          type: string
        propertyType:
          $ref: '#/components/schemas/AccommodationType'
        district:
          type: string
        nearestStationName:
          type: [string, 'null']
        monthlyPriceMin:
          type: integer
          minimum: 0
        coverImageUrl:
          type: [string, 'null']
        coverImageAlt:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
    SearchPropertyCard:
      allOf:
        - $ref: '#/components/schemas/PropertyCard'
        - type: object
          additionalProperties: false
          required: [latitude, longitude, distanceMeters]
          properties:
            latitude:
              type: number
            longitude:
              type: number
            distanceMeters:
              type: [number, 'null']
    PropertySearchResult:
      type: object
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchPropertyCard'
        totalCount:
          type: integer
          minimum: 0
    PropertyImage:
      type: object
      additionalProperties: false
      required: [id, storagePath, url, altText, sortOrder, isCover]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        storagePath:
          type: string
        url:
          type: string
        altText:
          type: [string, 'null']
        sortOrder:
          type: integer
        isCover:
          type: boolean
    PropertyRoom:
      type: object
      additionalProperties: false
      required: [id, name, roomType, sizeSqm, maxOccupancy, monthlyPriceKrw, status, availableFrom]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        roomType:
          type: [string, 'null']
        sizeSqm:
          type: [number, 'null']
        maxOccupancy:
          type: integer
          minimum: 1
        monthlyPriceKrw:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/RoomStatus'
        availableFrom:
          $ref: '#/components/schemas/NullableDate'
    PropertyAmenity:
      type: object
      additionalProperties: false
      required: [id, slug, name, icon]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        name:
          type: string
        icon:
          type: [string, 'null']
    PropertyDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - slug
        - description
        - propertyType
        - district
        - nearestStationName
        - nearestStationWalkMin
        - addressLine1
        - addressLine2
        - city
        - bookingMode
        - minStayNights
        - monthlyPriceMin
        - tags
        - hostDisplayName
        - latitude
        - longitude
        - images
        - rooms
        - amenities
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        propertyType:
          $ref: '#/components/schemas/AccommodationType'
        district:
          type: string
        nearestStationName:
          type: [string, 'null']
        nearestStationWalkMin:
          type: [integer, 'null']
        addressLine1:
          type: string
        addressLine2:
          type: [string, 'null']
        city:
          type: string
        bookingMode:
          $ref: '#/components/schemas/BookingMode'
        minStayNights:
          type: integer
          minimum: 1
        monthlyPriceMin:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: string
        hostDisplayName:
          type: string
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        images:
          type: array
          items:
            $ref: '#/components/schemas/PropertyImage'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/PropertyRoom'
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/PropertyAmenity'
    Amenity:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        name:
          type: string
    AmenityList:
      type: array
      items:
        $ref: '#/components/schemas/Amenity'
    HostPropertyRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - propertyType
        - addressLine1
        - city
        - district
        - bookingMode
        - minStayNights
