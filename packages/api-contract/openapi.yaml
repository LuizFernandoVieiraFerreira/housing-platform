          $ref: '#/components/schemas/AccommodationType'
        addressLine1:
          type: string
          minLength: 1
          maxLength: 200
        addressLine2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 80
        postalCode:
          type: string
          maxLength: 20
        district:
          type: string
          minLength: 1
          maxLength: 80
        nearestStationName:
          type: string
          maxLength: 120
        nearestStationWalkMin:
