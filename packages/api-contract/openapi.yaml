# Canonical HTTP contract for housing-platform REST backends.
# Zod schemas in generated/ are derived from this file. Do not treat them as the source of truth.
openapi: 3.1.0
info:
  title: Housing Platform API
  version: 0.1.0
  description: |
    Cross-language contract for the Python, Java, and Node backends.
    The Supabase client path is separate and is not described here.

    JSON properties are camelCase. Dates are `YYYY-MM-DD`. Timestamps are RFC 3339
    with a timezone offset. Protected operations require `Authorization: Bearer`
    with a Supabase Auth JWT. Role checks are enforced in each backend's service
    layer; this document does not encode row-level security.
servers:
  - url: http://localhost:8000
    description: Local REST backend
tags:
  - name: Properties
  - name: Bookings
  - name: Payments
  - name: Hosts
  - name: Admin
  - name: Notifications
  - name: Profile
security:
  - bearerAuth: []
paths:
  /api/v1/properties:
    get:
      tags: [Properties]
      operationId: searchProperties
      summary: Search published properties
      security: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/PropertyType'
        - $ref: '#/components/parameters/CheckIn'
        - $ref: '#/components/parameters/CheckOut'
        - $ref: '#/components/parameters/Guests'
        - $ref: '#/components/parameters/PriceMin'
        - $ref: '#/components/parameters/PriceMax'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CenterLat'
        - $ref: '#/components/parameters/CenterLng'
        - $ref: '#/components/parameters/North'
        - $ref: '#/components/parameters/South'
        - $ref: '#/components/parameters/East'
        - $ref: '#/components/parameters/West'
        - $ref: '#/components/parameters/AmenitySlugs'
        - $ref: '#/components/parameters/MaxStationWalkMin'
        - $ref: '#/components/parameters/ExcludePropertyIds'
      responses:
        '200':
          description: Matching published properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Properties]
      operationId: createProperty
      summary: Create a draft property
      description: Caller must be a host. The new property status is `draft`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostPropertyRequest'
      responses:
        '201':
          description: Draft property created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/{id}:
    get:
      tags: [Properties]
      operationId: getProperty
      summary: Get a published property
      security: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Published property detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Properties]
      operationId: updateProperty
      summary: Update a host-owned draft or pending property
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostPropertyRequest'
      responses:
        '200':
          description: Updated host view of the property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPropertyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/{id}/submit-review:
    post:
      tags: [Properties]
      operationId: submitPropertyForReview
      summary: Submit a property for review
      description: Host must own the property. It needs at least one room and a geocoded location.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property moved to pending review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyStatusChange'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/{id}/location:
    post:
      tags: [Properties]
      operationId: setPropertyLocation
      summary: Set property coordinates
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPropertyLocationRequest'
      responses:
        '204':
          description: Coordinates saved.
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/{id}/rooms:
    post:
      tags: [Properties]
      operationId: createRoom
      summary: Add a room to a host-owned property
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRoom'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/rooms/{roomId}:
    delete:
      tags: [Properties]
      operationId: deleteRoom
      summary: Delete a room on a host-owned property
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '204':
          description: Room deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/amenities:
    get:
      tags: [Properties]
      operationId: listAmenities
      summary: List amenities
      security: []
      responses:
        '200':
          description: Amenity catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings/quote:
    get:
      tags: [Bookings]
      operationId: quoteBooking
      summary: Get a price quote
      parameters:
        - $ref: '#/components/parameters/RoomIdQuery'
        - $ref: '#/components/parameters/CheckInRequired'
        - $ref: '#/components/parameters/CheckOutRequired'
        - $ref: '#/components/parameters/GuestCount'
      responses:
        '200':
          description: Price quote for the stay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingQuote'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List my bookings
      responses:
        '200':
          description: Bookings owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Create a booking hold
      description: Check-out must be after check-in. Overlapping stays are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking hold created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings/{id}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get one of my bookings
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking detail for the customer, host, or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings/{id}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Cancel my booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings/{id}/approve:
    post:
      tags: [Bookings]
      operationId: approveBooking
      summary: Approve a booking request
      description: Caller must be the host of the booking or an admin.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/bookings/{id}/reject:
    post:
      tags: [Bookings]
      operationId: rejectBooking
      summary: Reject a booking request
      description: Caller must be the host of the booking or an admin.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/payments/orders:
    post:
      tags: [Payments]
      operationId: createPaymentOrder
      summary: Create a payment order
      description: Caller must own the booking. The hold must still be active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentOrderRequest'
      responses:
        '201':
          description: Payment order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentOrderResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/payments/confirm:
    post:
      tags: [Payments]
      operationId: confirmPayment
      summary: Confirm a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Payment confirmation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPaymentResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ExternalServiceError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/payments/webhook:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      summary: Receive a Toss payment webhook
      description: No user JWT. The backend verifies the payment with Toss before changing state.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TossWebhookPayload'
      responses:
        '200':
          description: Webhook accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '502':
          $ref: '#/components/responses/ExternalServiceError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/hosts:
    post:
      tags: [Hosts]
      operationId: registerHost
      summary: Register the current user as a host
      description: Idempotent for an existing host profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHostRequest'
      responses:
        '201':
          description: Host profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/hosts/me:
    get:
      tags: [Hosts]
      operationId: getCurrentHost
      summary: Get the current host profile
      responses:
        '200':
          description: Host profile, or null when the user is not a host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableHost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/hosts/me/properties:
    get:
      tags: [Hosts]
      operationId: listHostProperties
      summary: List properties owned by the current host
      responses:
        '200':
          description: Host properties, including unpublished ones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPropertyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/hosts/me/properties/{id}:
    get:
      tags: [Hosts]
      operationId: getHostProperty
      summary: Get a host-owned property, including drafts
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Host property detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPropertyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/hosts/me/bookings:
    get:
      tags: [Hosts]
      operationId: listHostBookings
      summary: List bookings on the current host's properties
      responses:
        '200':
          description: Host booking inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostBookingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/stats:
    get:
      tags: [Admin]
      operationId: getAdminStats
      summary: Admin dashboard counts
      responses:
        '200':
          description: Open work counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/properties:
    get:
      tags: [Admin]
      operationId: listAdminProperties
      summary: List properties for review
      responses:
        '200':
          description: All non-deleted properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPropertyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/properties/{id}/publish:
    post:
      tags: [Admin]
      operationId: publishProperty
      summary: Publish a property
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyStatusChange'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/properties/{id}/reject:
    post:
      tags: [Admin]
      operationId: rejectPropertyReview
      summary: Reject a property review
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property review rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyStatusChange'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/hosts:
    get:
      tags: [Admin]
      operationId: listAdminHosts
      summary: List hosts
      responses:
        '200':
          description: Host accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHostList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/hosts/{id}/approve:
    post:
      tags: [Admin]
      operationId: approveHost
      summary: Approve a host
      parameters:
        - $ref: '#/components/parameters/HostId'
      responses:
        '200':
          description: Host approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/bookings:
    get:
      tags: [Admin]
      operationId: listAdminBookings
      summary: List bookings
      responses:
        '200':
          description: All bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostBookingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/payments:
    get:
      tags: [Admin]
      operationId: listAdminPayments
      summary: List payments
      responses:
        '200':
          description: Payment records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/housing-requests:
    get:
      tags: [Admin]
      operationId: listHousingRequests
      summary: List housing requests
      responses:
        '200':
          description: Customer housing requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HousingRequestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/housing-requests/{id}:
    patch:
      tags: [Admin]
      operationId: updateHousingRequestStatus
      summary: Update a housing request status
      parameters:
        - $ref: '#/components/parameters/HousingRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
